# Общая конфигурация ИС «Сходим» (Этап 3).
# Профиль выбирается флагом --spring.profiles.active=local|helios.
spring:
  application:
    name: skhodim
  profiles:
    active: local

server:
  port: 8080

logging:
  level:
    ru.ifmo.skhodim: INFO
    org.springframework.jdbc.core.JdbcTemplate: WARN

# Параметры приложения, не относящиеся к Spring Boot автоконфигурации.
app:
  schema: skhodim
  request-expiration:
    enabled: true
    fixed-delay-ms: 60000
