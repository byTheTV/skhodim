# Общая конфигурация ИС «Сходим» (Этап 3).
# Профиль выбирается флагом --spring.profiles.active=local|helios.
spring:
  application:
    name: skhodim
  profiles:
    active: local

server:
  port: 8080

logging:
  level:
    ru.ifmo.skhodim: INFO
    org.springframework.jdbc.core.JdbcTemplate: WARN

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    try-it-out-enabled: true
    display-request-duration: true
    doc-expansion: list
  default-produces-media-type: application/json
  api-docs:
    path: /v3/api-docs

app:
  schema: skhodim
  request-expiration:
    enabled: true
    fixed-delay-ms: 60000
  jwt:
    secret: ${SKHODIM_JWT_SECRET:skhodim-dev-secret-please-change-32b}
    ttl-seconds: 86400
  kassir:
    base-url: https://spb.kassir.ru
  afisha:
    base-url: https://www.afisha.ru
  catalog:
    refresh-cron: "0 0 6 * * *"
  kudago:
    base-url: https://kudago.com/public-api/v1.4
    location: spb
    page-size: 20
    max-pages: 2
