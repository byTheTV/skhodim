# Профиль для запуска на сервере helios (ssh helios.se.ifmo.ru), где приложение
# обращается к PostgreSQL напрямую по имени хоста "pg" и работает в личной схеме.
# Схема и пароль передаются переменными окружения, чтобы не коммитить секреты:
#   SKHODIM_SCHEMA=s467667 SKHODIM_DB_PASSWORD=*** java -jar skhodim.jar --spring.profiles.active=helios
# Снаружи: ssh -L 8080:127.0.0.1:8080 -p 2222 s467667@helios.se.ifmo.ru → http://localhost:8080/api/health
server:
  port: ${SERVER_PORT:18080}
  address: 127.0.0.1

spring:
  datasource:
    url: jdbc:postgresql://pg:5432/studs?currentSchema=${SKHODIM_SCHEMA},public
    username: ${SKHODIM_SCHEMA}
    password: ${SKHODIM_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5

app:
  schema: ${SKHODIM_SCHEMA}
