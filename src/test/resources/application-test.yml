# Конфигурация для интеграционных тестов уровня хранения/бизнес-логики (Этап 3).
# Использует ту же локальную БД skhodim_course, что поднимается sql/README.md.
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/skhodim_course?currentSchema=skhodim,public
    username: postgres
    password: ${SKHODIM_DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

app:
  schema: skhodim
  request-expiration:
    enabled: false
